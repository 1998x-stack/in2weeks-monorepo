name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_DB: in2weeks
          POSTGRES_USER: in2weeks
          POSTGRES_PASSWORD: in2weeks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U in2weeks -d in2weeks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://in2weeks:in2weeks@localhost:5432/in2weeks
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: ci-only-secret-replace-in-production
      EMAIL_SERVER: smtp://127.0.0.1:1025
      EMAIL_FROM: In2Weeks CI <ci@in2weeks.local>
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run check:env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:migrate
      - run: npm run content:import
      - run: npm run smoke:sprint
      - run: npm run build
      - run: npm run test:e2e
